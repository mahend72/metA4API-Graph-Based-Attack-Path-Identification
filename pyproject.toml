[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "iocevaluator"
version = "0.2.0"
description = "metA4API: meta-graph (MeGiTS) based attack-path identification over a threat-intelligence knowledge graph"
requires-python = ">=3.10"
dependencies = ["numpy>=1.23", "scipy>=1.10", "pandas>=2.0", "scikit-learn>=1.3", "torch>=2.1", "python-dotenv>=1.0", "OTXv2>=1.5.12"]

[project.optional-dependencies]
embeddings = ["sentence-transformers>=2.6"]
gcn = ["torch>=2.1"]
test = ["pytest>=7"]
all = ["sentence-transformers>=2.6", "pytest>=7"]

[project.scripts]
iocevaluator = "iocevaluator.cli:main"

[tool.setuptools.packages.find]
include = ["iocevaluator*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore:Sparse invariant checks:UserWarning", "ignore:The least populated class:UserWarning"]
